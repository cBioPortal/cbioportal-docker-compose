events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not log request URIs: backend paths can contain patient identifiers
    # and WSI source paths must never enter proxy logs.
    log_format wsi_safe '$remote_addr $request_method $status $request_time $upstream_response_time';
    access_log /var/log/nginx/access.log wsi_safe;
    error_log /var/log/nginx/error.log warn;
    sendfile on;

    upstream frontend {
        server host.docker.internal:3000;
    }

    upstream wsi_tile_server {
        server slide-viewer:8080;
    }

    upstream cbioportal_backend {
        server cbioportal:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;

        # The explicit WSI namespace prevents collisions with frontend routes.
        # The tile server exposes the same API under the /wsi namespace.
        location ^~ /wsi/ {
            proxy_pass http://wsi_tile_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 3001;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        location ^~ /api/ {
            proxy_pass http://cbioportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 3001;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ^~ /saml2/ {
            proxy_pass http://cbioportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 3001;
        }

        location ^~ /login/saml2/ {
            proxy_pass http://cbioportal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Origin "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 3001;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
