# USAGE: adds a Keycloak identity provider and switches cBioPortal to SAML login. E.g.
#  'docker compose -f docker-compose.yml -f dev/keycloak/keycloak.yml up'

services:
  cbioportal:
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ${KEYCLOAK_CRT_PATH:-./dev/keycloak/keycloak.crt}:/cbioportal-webapp/local.crt:ro
      - ${KEYCLOAK_KEY_PATH:-./dev/keycloak/keycloak.key}:/cbioportal-webapp/local.key:ro
    command: /bin/sh -c "
      java
      -Xms2g
      -Xmx4g
      -cp '/cbioportal-webapp:/cbioportal-webapp/lib/*'
      org.cbioportal.PortalApplication
      --spring.config.location=file:/cbioportal-webapp/application.properties
      --session.service.url=http://cbioportal-session:5001/api/sessions/my_portal/
      --clickhouse_mode=true
      --spring.profiles.active=clickhouse
      --authenticate=saml
      --spring.security.saml2.relyingparty.registration.cbio-idp.assertingparty.metadata-uri=http://keycloak:8080/realms/cbio/protocol/saml/descriptor
      --spring.security.saml2.relyingparty.registration.cbio-idp.entity-id=cbioportal
      --spring.security.saml2.relyingparty.registration.cbio-idp.signing.credentials[0].certificate-location=classpath:/local.crt
      --spring.security.saml2.relyingparty.registration.cbio-idp.signing.credentials[0].private-key-location=classpath:/local.key
      --dat.method=none
      --filter_groups_by_appname=false
      --security.cors.allowed-origins=*
      "

  keycloak:
    restart: unless-stopped
    image: ${DOCKER_IMAGE_KEYCLOAK:-quay.io/keycloak/keycloak:26.7}
    container_name: keycloak
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    networks:
      - cbio-net
    volumes:
      - ${KEYCLOAK_CONFIG_PATH:-./dev/keycloak/keycloak-config.json}:/opt/keycloak/data/import/realm.json:ro
    environment:
      # cBioPortal reads the SAML metadata over the compose network (http://keycloak:8080), but the
      # login URLs in that metadata are followed by the browser. Pinning the hostname makes Keycloak
      # advertise the address that is published on the host.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    healthcheck:
      # The Keycloak image ships without curl/wget, so probe the health endpoint through bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
