# USAGE: use this configuration for loading the "web" image (with app.jar) as opposed to 
#  the "web-and-data" image. E.g.
#  'docker compose -f  docker-compose.yml -f docker-compose.web.yml up'

version: '3'

services:
  cbioportal:
    env_file:
      - path: ./.env
        required: false
    # The web-only image has no python3 / db-scripts (see docker/web/Dockerfile in the main
    # cbioportal repo), so it can't run cbioportal-migration's entrypoint. Web-only deployments
    # are expected to point at a database that's already at the current schema version (e.g. a
    # shared, externally-managed ClickHouse instance) rather than self-migrate on startup.
    depends_on: !override
      cbioportal-database:
        condition: service_healthy
      cbioportal-session:
        condition: service_started
    command: /bin/sh -c "
      java 
      -Xms2g 
      -Xmx4g 
      -jar /cbioportal-webapp/app.jar  
      --authenticate=false 
      --session.service.url=http://cbioportal-session:5001/api/sessions/my_portal/
      --spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
      --spring.datasource.url=$${CLICKHOUSE_URL}
      --spring.datasource.username=$${CLICKHOUSE_USER}
      --spring.datasource.password=$${CLICKHOUSE_PASSWORD}
      --spring.datasource.clickhouse.url=$${CLICKHOUSE_URL}
      --spring.datasource.clickhouse.username=$${CLICKHOUSE_USER}
      --spring.datasource.clickhouse.password=$${CLICKHOUSE_PASSWORD}
      --spring.datasource.clickhouse.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
      --clickhouse_mode=$${APP_CLICKHOUSE_MODE:-true}
      $${APP_CUSTOM_ARGS}
      "

  cbioportal-migration:
    deploy:
      replicas: 0
